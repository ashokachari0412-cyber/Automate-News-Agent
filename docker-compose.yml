# ==============================================================================
# Multi-Container Compose Setup — Personal AI News Agent
#
# Services:
#   1. api:        FastAPI Orchestrator & REST Engine (Port 8000)
#   2. bot:        Interactive Telegram Bot (Human-in-the-Loop Review & Video Gen)
#   3. scheduler:  Autonomous Periodic 24h AI News Scanner & Dispatcher
#   4. redis:      Shared In-Memory Cache & Message Broker (Port 6379)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Shared Cache & State Store (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: news-agent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - news-agent-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Service 2: FastAPI Orchestrator & REST Backend
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-agent-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - ENABLE_EMBEDDED_BOT=false
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Kolkata
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
      - ./assets:/app/assets
      - ./userdata:/app/userdata
      - ./config:/app/config
      - ./cookies.json:/app/cookies.json:ro
    networks:
      - news-agent-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Service 3: Interactive Telegram Bot (Human-in-the-Loop Review)
  # ----------------------------------------------------------------------------
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-agent-bot
    restart: unless-stopped
    command: ["python", "-m", "src.cli", "bot"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://api:8000
      - TZ=Asia/Kolkata
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
      - ./assets:/app/assets
      - ./userdata:/app/userdata
      - ./config:/app/config
      - ./cookies.json:/app/cookies.json:ro
    networks:
      - news-agent-net
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Service 4: Autonomous News Pipeline Scheduler (Strict 24h News Engine)
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: news-agent-scheduler
    restart: unless-stopped
    command: ["python", "-m", "src.cli", "scheduler"]
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://api:8000
      - TZ=Asia/Kolkata
    volumes:
      - ./src:/app/src
      - ./artifacts:/app/artifacts
      - ./assets:/app/assets
      - ./userdata:/app/userdata
      - ./config:/app/config
      - ./cookies.json:/app/cookies.json:ro
    networks:
      - news-agent-net
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  news-agent-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
