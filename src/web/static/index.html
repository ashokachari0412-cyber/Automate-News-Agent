<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfred AI</title>
  <meta name="description" content="Alfred AI — Personal Intelligence Butler for Ashok" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png?v=11" />
  <link rel="apple-touch-icon" href="icon-192.png?v=11" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#121214" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alfred" />
  <link rel="stylesheet" href="styles.css?v=15" />
</head>
<body class="alfred-theme">

  <div class="app-layout">
    <!-- Top Header -->
    <header class="top-nav">
      <div class="nav-left">
        <div class="brand-logo-wrap">
          <img class="brand-logo-img" src="logo.png?v=11" alt="Alfred AI">
        </div>
        <span class="brand-title">Alfred AI</span>
      </div>

      <div class="nav-right">
        <div class="profile-wrap">
          <button class="menu-trigger" id="profile-btn" title="Menu" aria-haspopup="true" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
            <span class="user-avatar-pill">A</span>
          </button>
          <div class="profile-menu hidden" id="profile-menu" role="menu">
            <div class="profile-menu-header">
              <span class="user-avatar-pill large">A</span>
              <div>
                <div class="profile-name">Ashok P</div>
                <div class="profile-handle">@ashok_a.i</div>
              </div>
            </div>
            <button class="profile-menu-item" id="google-btn" role="menuitem" title="Connect your Google account">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
              <span>Connect Google</span>
            </button>
            <button class="profile-menu-item" id="history-btn" role="menuitem" title="View chat history">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span>History</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Chat Workspace -->
    <main class="chat-workspace" id="chat-workspace">
      <div class="workspace-inner">

        <!-- Welcome Hero (Displayed when chat is fresh) -->
        <div class="hero-section" id="hero-section">
          <!-- Glowing Fedora Emblem -->
          <div class="hero-emblem-wrap">
            <div class="hero-emblem-card">
              <img class="hero-logo-img" src="logo.png?v=11" alt="Alfred AI">
            </div>
          </div>

          <h1 class="hero-title">Welcome, Ashok</h1>
          <p class="hero-subtitle">Your personal intelligence butler is ready. Choose a quick action below or type a custom request.</p>

          <!-- 2x2 Quick Action Cards Grid -->
          <div class="action-grid">
            <button class="action-card" data-prompt="Scan the latest 24h AI breaking news across all authorized labs and summarize the top discoveries.">
              <div class="action-card-left">
                <div class="action-icon-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
                </div>
                <span class="action-title">Scan News</span>
              </div>
              <svg class="action-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <button class="action-card" data-prompt="Summarize my priority briefings, newsletters, and incoming updates for today.">
              <div class="action-card-left">
                <div class="action-icon-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                </div>
                <span class="action-title">Summarize Emails</span>
              </div>
              <svg class="action-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <button class="action-card" data-prompt="Analyze our AI news automation code, collectors, and prompt architecture.">
              <div class="action-card-left">
                <div class="action-icon-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </div>
                <span class="action-title">Analyze Code</span>
              </div>
              <svg class="action-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>

            <button class="action-card" data-prompt="Brainstorm 5 high-impact viral content ideas for @ashok_a.i based on the latest AI trends.">
              <div class="action-card-left">
                <div class="action-icon-box">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
                </div>
                <span class="action-title">Brainstorm Ideas</span>
              </div>
              <svg class="action-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>

        <!-- Chat Conversation Messages -->
        <div class="chat-stream" id="chat-messages"></div>
      </div>
    </main>

    <!-- Bottom Floating Input Bar -->
    <footer class="chat-footer">
      <div class="input-card">
        <div class="quick-chips">
          <button class="quick-chip toggle" id="g-intel-btn" type="button" aria-pressed="false"
                  title="G-Intelligence: ask about your Google apps (Drive, Docs, Sheets, Gmail, Calendar, Photos)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 12h-9"/></svg>
            <span class="lbl-full">G-Intelligence</span><span class="lbl-short">G-Intel</span>
          </button>
          <button class="quick-chip" id="ai-updates-btn" type="button" title="Scan the latest 24h AI news">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49"/></svg>
            <span class="lbl-full">AI Updates</span><span class="lbl-short">AI News</span>
          </button>
          <button class="quick-chip" id="custom-script-btn" type="button" title="Write your own script for a video or image">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span class="lbl-full">Custom Script</span><span class="lbl-short">Script</span>
          </button>
          <button class="quick-chip" id="content-monitor-btn" type="button" title="Content-Monitor (coming soon)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            <span class="lbl-full">Content-Monitor</span><span class="lbl-short">Monitor</span>
          </button>
        </div>
        <div class="input-controls-row">
          <!-- Left Attachment & Mic Icons -->
          <div class="input-tools-left">
            <button class="tool-btn" id="attach-btn" title="Attach context">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l7.88-7.88"/></svg>
            </button>
            <button class="tool-btn" id="voice-btn" title="Voice input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
            </button>
            <button class="tool-btn" id="new-chat-btn" title="New chat (current chat is saved to History)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>

          <!-- Textarea -->
          <textarea
            id="chat-input"
            class="chat-textarea"
            placeholder="Type your request to Alfred..."
            rows="1"
          ></textarea>

          <!-- Upward Arrow Send Button -->
          <button class="send-action-btn" id="send-btn" title="Send message" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>

      </div>
    </footer>

    <!-- Custom Script panel -->
    <div class="script-panel hidden" id="script-panel" role="dialog" aria-label="Custom script">
      <div class="script-panel-card">
        <div class="script-panel-head">
          <h3>Custom Script</h3>
          <button type="button" class="close-drawer-btn" id="script-close">✕</button>
        </div>
        <div class="script-kind" role="tablist">
          <button type="button" class="script-kind-btn active" data-kind="video">Video (9:16 · HeyGen)</button>
          <button type="button" class="script-kind-btn" data-kind="image">Image</button>
        </div>
        <div class="script-heygen" id="script-heygen">Checking HeyGen...</div>
        <textarea id="script-text" rows="8" placeholder="Write exactly what you will say. Alfred keeps your words, splits them into clips and adds the visuals."></textarea>
        <div class="script-aspect hidden" id="script-aspect">
          <span>Ratio</span>
          <select id="script-aspect-select">
            <option value="4:5">4:5 post</option>
            <option value="1:1">1:1 square</option>
            <option value="9:16">9:16 story</option>
            <option value="16:9">16:9 wide</option>
          </select>
        </div>
        <button type="button" class="msg-action-btn primary script-go" id="script-go">Generate video</button>
      </div>
    </div>

    <!-- History Drawer / Modal -->
    <div class="history-drawer hidden" id="history-drawer">
      <div class="history-header">
        <h3>Chat History</h3>
        <button class="close-drawer-btn" id="close-history-btn">✕</button>
      </div>
      <div class="history-content" id="history-content"></div>
    </div>
    <div class="drawer-backdrop hidden" id="drawer-backdrop"></div>
  </div>

  <script src="app.js?v=16"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW registration failed:", e));
    }
  </script>
</body>
</html>
